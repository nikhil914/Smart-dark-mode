# Xcode project for the Safari app and extension, generated with XcodeGen:
#   pnpm --filter @sdm/extension build:safari
#   xcodegen generate --spec apps/safari-host/project.yml
# The generated .xcodeproj is not committed; this file is the source of truth.
name: SmartDarkMode
options:
  bundleIdPrefix: io.github.nikhil914
  deploymentTarget:
    iOS: '16.4'
    macOS: '13.0'
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    SWIFT_VERSION: '5.0'
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic

targetTemplates:
  HostApp:
    type: application
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.nikhil914.SmartDarkMode
        PRODUCT_NAME: Smart Dark Mode
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Smart Dark Mode
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  WebExtension:
    type: app-extension
    sources: [Extension, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.nikhil914.SmartDarkMode.Extension
        PRODUCT_NAME: Smart Dark Mode Extension
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Extension/Info.plist
    postCompileScripts:
      # Copies the built web extension into the bundle's resources, flat, as Safari expects.
      - name: Copy web extension
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          SRC="${SRCROOT}/../extension/.output/safari-mv3"
          if [ ! -f "${SRC}/manifest.json" ]; then
            echo "error: run 'pnpm --filter @sdm/extension build:safari' first" >&2
            exit 1
          fi
          ditto "${SRC}" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"

targets:
  SmartDarkMode-iOS:
    templates: [HostApp]
    platform: iOS
    entitlements:
      path: App/iOS.entitlements
      properties:
        com.apple.security.application-groups: [group.io.github.nikhil914.smartdarkmode]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    dependencies:
      - target: SmartDarkModeExtension-iOS
      # Linking AppIntents lets Xcode extract the Shortcuts actions' metadata.
      - sdk: AppIntents.framework

  SmartDarkModeExtension-iOS:
    templates: [WebExtension]
    platform: iOS
    entitlements:
      path: Extension/iOS.entitlements
      properties:
        com.apple.security.application-groups: [group.io.github.nikhil914.smartdarkmode]

  SmartDarkMode-macOS:
    templates: [HostApp]
    platform: macOS
    entitlements:
      path: App/macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [group.io.github.nikhil914.smartdarkmode]
    dependencies:
      - target: SmartDarkModeExtension-macOS
      - sdk: SafariServices.framework
      - sdk: AppIntents.framework

  SmartDarkModeExtension-macOS:
    templates: [WebExtension]
    platform: macOS
    entitlements:
      path: Extension/macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [group.io.github.nikhil914.smartdarkmode]
