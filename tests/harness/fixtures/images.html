<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Images</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #fff;
        color: #222;
        font: 16px system-ui;
      }
    </style>
  </head>
  <body>
    <p>
      Dark transparent icon (should become visible):
      <img id="icon" src="icon-dark.png" width="24" height="24" alt="icon" />
    </p>
    <p>Photo (must not be inverted):</p>
    <img id="photo" src="photo.png" width="400" height="260" alt="photo" />
  </body>
</html>
