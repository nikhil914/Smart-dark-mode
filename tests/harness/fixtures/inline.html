<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Inline styles</title>
  </head>
  <body style="margin: 0; background-color: #ffffff; color: #333333; font: 16px system-ui">
    <div style="background: #f5f5f5; padding: 16px; border-bottom: 1px solid #e0e0e0">
      Inline header
    </div>
    <table bgcolor="#ffffee" cellpadding="8">
      <tr>
        <td><font color="#000080">Legacy bgcolor table with font color</font></td>
      </tr>
    </table>
    <p style="color: #555">Inline grey text.</p>
    <svg width="48" height="48" viewBox="0 0 24 24"><path fill="#202124" d="M12 2 2 22h20z" /></svg>
    <div id="late"></div>
    <script>
      setTimeout(() => {
        document
          .getElementById('late')
          .setAttribute('style', 'background:#ffffff;color:#111;padding:12px');
        document.getElementById('late').textContent = 'Inline style set at 1.5 s';
      }, 1500);
    </script>
  </body>
</html>
