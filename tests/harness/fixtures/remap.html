<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Brand colours</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #fff;
        color: #222;
        font: 16px system-ui;
      }
      .brand {
        background: #e8f0fe;
        color: #1a73e8;
        padding: 16px;
        margin: 8px 0;
      }
      .brand-2 {
        border: 3px solid #1a73e8;
        padding: 16px;
      }
    </style>
  </head>
  <body>
    <div class="brand" id="a">Brand blue text on a light blue panel</div>
    <div class="brand-2" id="b">Brand blue border</div>
  </body>
</html>
