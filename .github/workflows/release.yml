name: Release

# Builds the store packages and attaches them to a draft release named after the version
# in apps/extension/package.json. Start it with "Run workflow" on the Actions tab, or by
# pushing a version tag (v1.2.3). Publishing the draft creates the tag if it is missing.
# Uploading to the stores is done by hand from those files (docs/RELEASE.md).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Version
        id: version
        run: |
          tag="v$(node -p "require('./apps/extension/package.json').version")"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "${tag}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${tag}"; exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - run: pnpm lint && pnpm typecheck && pnpm test
      - name: Packages
        working-directory: apps/extension
        run: |
          pnpm exec wxt zip -b chrome --mv3
          pnpm exec wxt zip -b edge --mv3
          pnpm exec wxt zip -b firefox --mv3
          pnpm exec wxt zip -b safari --mv3
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: >
          gh release create "${TAG}" --draft --generate-notes --target "${GITHUB_SHA}"
          --title "${TAG}" apps/extension/.output/*.zip
