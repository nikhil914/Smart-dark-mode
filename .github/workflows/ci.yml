name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Lint Firefox package
        run: npx --yes web-ext@10.8.0 lint -s apps/extension/.output/firefox-mv3 --warnings-as-errors=false
      - uses: actions/upload-artifact@v4
        with:
          name: extension-builds
          path: |
            apps/extension/.output/chrome-mv3
            apps/extension/.output/firefox-mv3
